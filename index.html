<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate CRM - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // API Base URL - Change this to your deployed backend URL
        // For local development: 'http://localhost:8080'
        // For Render deployment: 'https://real-estate-crm-backend-3any.onrender.com'
        const API_BASE_URL = localStorage.getItem('API_BASE_URL') || 'https://real-estate-crm-backend-3any.onrender.com';

        // Shared option lists (used by both the filter panel and the property form)
        const LOCALITIES = ["Wakad", "Hinjawadi", "Ravet", "Tathawade", "Moshi", "Chinchwad", "Punawale", "Kiwale", "Mamurdi", "Baner", "Balewadi",
            "Kharadi", "Aundh", "Bavdhan", "Vikas Nagar", "Adarsh Nagar", "Pimpri"];
        const CITIES = ["Pimpri-Chinchwad", "Pune"];
        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const SALE_TYPES = ["Ready to Move", "Under Construction", "Resale", "Rent"];
        const FURNISHING_OPTIONS = [
            { value: "No", label: "Unfurnished" },
            { value: "Semi", label: "Semi-Furnished" },
            { value: "Full", label: "Fully Furnished" }
        ];

        const PARKING_OPTIONS = ["OPEN", "COVERED"];

        const EMPTY_FILTERS = {
            propertyType: "",
            flatType: "",
            minBudget: "",
            maxBudget: "",
            locality: "",
            city: "",
            possessionMonth: "",
            possessionYear: "",
            amenities: "",
            saleType: "",
            furnishing: "",
            carpetArea: "",
            floorNumber: "",
            parking: ""
        };

        const LEAD_EMPTY_FILTERS = {
            source: "",
            propertyName: "",
            customerName: "",
            status: ""
        };

        const LEAD_SOURCES = ["Website", "Referral", "Advertisement", "Social Media", "Email", "Phone", "Walk-in", "Other"];
        const LEAD_STATUSES = ["NEW", "CONTACTED", "ACTIVE", "NEGOTIATION", "WON", "LOST"];

        const SITE_VISIT_EMPTY_FILTERS = {
            leadName: "",
            propertyName: "",
            status: "",
            dateFrom: "",
            dateTo: ""
        };

        const VISIT_STATUSES = ["SCHEDULED", "COMPLETED", "CANCELLED", "NO_SHOW"];

        const FOLLOW_UP_EMPTY_FILTERS = {
            leadName: "",
            status: "",
            dateFrom: ""
        };

        const FOLLOW_UP_STATUSES = ["PENDING", "COMPLETED", "CANCELLED", "RESCHEDULED"];

        // Authentication utilities
        const getAuthToken = () => localStorage.getItem('authToken');
        const setAuthToken = (token) => localStorage.setItem('authToken', token);
        const removeAuthToken = () => localStorage.removeItem('authToken');
        const isAuthenticated = () => !!getAuthToken();

        // Login Component
        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                // Simple client-side authentication check
                if (username === 'admin' && password === 'admin123') {
                    setAuthToken('dummy-token');
                    onLogin();
                } else {
                    setError('Invalid credentials. Please try again.');
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Real Estate CRM</h1>
                            <p className="text-gray-600">Admin Dashboard Login</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Enter username"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Enter password"
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md text-sm">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 text-white py-3 rounded-md font-medium hover:bg-blue-700 transition-colors disabled:bg-blue-400 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Signing in...' : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Format price in Indian Rupees
        const formatPrice = (price) => {
            if (price >= 10000000) {
                return `₹${(price / 10000000).toFixed(2)} Cr`;
            } else if (price >= 100000) {
                return `₹${(price / 100000).toFixed(2)} L`;
            }
            return `₹${price.toLocaleString('en-IN')}`;
        };

        const getFurnishingLabel = (value) => {
            const match = FURNISHING_OPTIONS.find(o => o.value === value);
            return match ? match.label : null;
        };

        // Filter Component
        function FilterPanel({ filters, setFilters }) {
            const currentYear = new Date().getFullYear();
            const years = Array.from({ length: 5 }, (_, i) => currentYear + i);

            const handleReset = () => {
                setFilters({ ...EMPTY_FILTERS });
            };

            const nonFlatSelected = filters.propertyType && filters.propertyType !== "Flat";

            return (
                <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-semibold text-gray-800">Property Filters</h2>
                        <button 
                            onClick={handleReset}
                            className="text-sm text-blue-600 hover:text-blue-800 font-medium"
                        >
                            Reset Filters
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {/* Property Type */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Property Type</label>
                            <select
                                value={filters.propertyType}
                                onChange={(e) => setFilters({...filters, propertyType: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Types</option>
                                <option value="Flat">Flat</option>
                                <option value="Plot">Plot</option>
                                <option value="Land">Land</option>
                            </select>
                        </div>

                        {/* Flat Type */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Flat Type</label>
                            <select
                                value={filters.flatType}
                                onChange={(e) => setFilters({...filters, flatType: e.target.value})}
                                disabled={nonFlatSelected}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
                            >
                                <option value="">All Configurations</option>
                                <option value="1 BHK">1 BHK</option>
                                <option value="2 BHK">2 BHK</option>
                                <option value="3 BHK">3 BHK</option>
                                <option value="4 BHK">4 BHK</option>
                            </select>
                        </div>

                        {/* Sale Type */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Sale Type</label>
                            <select
                                value={filters.saleType}
                                onChange={(e) => setFilters({...filters, saleType: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All</option>
                                {SALE_TYPES.map(type => (
                                    <option key={type} value={type}>{type}</option>
                                ))}
                            </select>
                        </div>

                        {/* Furnishing */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Furnishing</label>
                            <select
                                value={filters.furnishing}
                                onChange={(e) => setFilters({...filters, furnishing: e.target.value})}
                                disabled={nonFlatSelected}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
                            >
                                <option value="">Any</option>
                                {FURNISHING_OPTIONS.map(opt => (
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                ))}
                            </select>
                        </div>

                        {/* Budget Range - Min */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Min Budget (₹)</label>
                            <input
                                type="number"
                                value={filters.minBudget}
                                onChange={(e) => setFilters({...filters, minBudget: e.target.value})}
                                placeholder="Min"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Budget Range - Max */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Max Budget (₹)</label>
                            <input
                                type="number"
                                value={filters.maxBudget}
                                onChange={(e) => setFilters({...filters, maxBudget: e.target.value})}
                                placeholder="Max"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Carpet Area */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Min Carpet Area (sqft)</label>
                            <input
                                type="number"
                                value={filters.carpetArea}
                                onChange={(e) => setFilters({...filters, carpetArea: e.target.value})}
                                placeholder="e.g., 1000"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Floor Number */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Floor Number</label>
                            <input
                                type="number"
                                value={filters.floorNumber}
                                onChange={(e) => setFilters({...filters, floorNumber: e.target.value})}
                                placeholder="Floor"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Parking */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Parking</label>
                            <select
                                value={filters.parking}
                                onChange={(e) => setFilters({...filters, parking: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All</option>
                                {PARKING_OPTIONS.map(option => (
                                    <option key={option} value={option}>{option}</option>
                                ))}
                            </select>
                        </div>

                        {/* Locality */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Locality</label>
                            <select
                                value={filters.locality}
                                onChange={(e) => setFilters({...filters, locality: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Localities</option>
                                {LOCALITIES.map(locality => (
                                    <option key={locality} value={locality}>{locality}</option>
                                ))}
                            </select>
                        </div>

                        {/* City */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">City</label>
                            <select
                                value={filters.city}
                                onChange={(e) => setFilters({...filters, city: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Cities</option>
                                {CITIES.map(city => (
                                    <option key={city} value={city}>{city}</option>
                                ))}
                            </select>
                        </div>

                        {/* Possession Month */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Possession Month</label>
                            <select
                                value={filters.possessionMonth}
                                onChange={(e) => setFilters({...filters, possessionMonth: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">Any Month</option>
                                {MONTHS.map(month => (
                                    <option key={month} value={month}>{month}</option>
                                ))}
                            </select>
                        </div>

                        {/* Possession Year */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Possession Year</label>
                            <select
                                value={filters.possessionYear}
                                onChange={(e) => setFilters({...filters, possessionYear: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">Any Year</option>
                                {years.map(year => (
                                    <option key={year} value={year}>{year}</option>
                                ))}
                            </select>
                        </div>

                        {/* Amenities */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Amenities Available</label>
                            <select
                                value={filters.amenities}
                                onChange={(e) => setFilters({...filters, amenities: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">Any</option>
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                    </div>
                </div>
            );
        }

        // Property Card Component
        function PropertyCard({ property, onEdit, onDelete }) {
            const getPropertyTypeDisplay = () => {
                if (property.propertyType === "Flat" && property.flatType) {
                    return `${property.flatType} Flat`;
                }
                return property.propertyType === "Plot" ? "Residential Plot" : `${property.propertyType}`;
            };

            const furnishingLabel = getFurnishingLabel(property.furnishing);

            return (
                <div className="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">
                    <div className="p-5 font-semibold">
                        <div className="flex justify-between items-start mb-3">
                            <h3 className="text-lg font-bold text-gray-900 flex-1">{property.name}</h3>
                            <span className={`px-2 py-1 text-xs font-semibold rounded-full ${property.amenities ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}`}>
                                {property.amenities ? 'Amenities: Yes' : 'Amenities: No'}
                            </span>
                        </div>

                        {(property.saleType || furnishingLabel) && (
                            <div className="flex flex-wrap gap-2 mb-3">
                                {property.saleType && (
                                    <span className="px-2 py-1 text-xs font-semibold rounded-full bg-sky-100 text-sky-800">
                                        {property.saleType}
                                    </span>
                                )}
                                {furnishingLabel && (
                                    <span className="px-2 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-800">
                                        {furnishingLabel}
                                    </span>
                                )}
                            </div>
                        )}
                        
                        <div className="space-y-2 text-sm font-semibold text-gray-700">
                            <div className="flex items-center">
                                <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span>{property.locality}, {property.city}</span>
                            </div>
                            
                            <div className="flex items-center">
                                <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span>Possession: {property.possessionMonth} {property.possessionYear}</span>
                            </div>
                            
                            <div className="flex items-center">
                                <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                                </svg>
                                <span>{getPropertyTypeDisplay()}</span>
                            </div>

                            {property.carpetArea && (
                                <div className="flex items-center">
                                    <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                                    </svg>
                                    <span>Carpet Area: {property.carpetArea} sqft</span>
                                </div>
                            )}

                            {property.floorNumber && (
                                <div className="flex items-center">
                                    <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                    </svg>
                                    <span>Floor: {property.floorNumber}</span>
                                </div>
                            )}

                            {property.parking && (
                                <div className="flex items-center">
                                    <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                                    </svg>
                                    <span>Parking: {property.parking}</span>
                                </div>
                            )}
                        </div>
                        
                        <div className="mt-4 pt-4 border-t border-gray-100">
                            <div className="text-2xl font-bold text-blue-600 mb-3">
                                {formatPrice(property.price)}
                            </div>
                            <div className="flex space-x-2">
                                <button
                                    onClick={() => onEdit(property)}
                                    className="flex-1 px-3 py-2 bg-blue-600 text-white text-sm font-semibold rounded hover:bg-blue-700 transition-colors"
                                >
                                    Edit
                                </button>
                                <button
                                    onClick={() => onDelete(property.id)}
                                    className="flex-1 px-3 py-2 bg-red-600 text-white text-sm font-semibold rounded hover:bg-red-700 transition-colors"
                                >
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Property Form Component
        function PropertyForm({ property, onSave, onCancel }) {
            const currentYear = new Date().getFullYear();
            const years = Array.from({ length: 5 }, (_, i) => currentYear + i);

            const [formData, setFormData] = useState(property ? {
                ...property,
                saleType: property.saleType || "",
                furnishing: property.furnishing || "",
                carpetArea: property.carpetArea || "",
                floorNumber: property.floorNumber || "",
                parking: property.parking || ""
            } : {
                name: "",
                locality: "",
                city: "",
                possessionMonth: "",
                possessionYear: "",
                price: "",
                propertyType: "",
                flatType: "",
                amenities: false,
                saleType: "",
                furnishing: "",
                carpetArea: "",
                floorNumber: "",
                parking: ""
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    ID: property?.id,
                    ...formData,
                    price: Number(formData.price),
                    amenities: formData.amenities === "true" || formData.amenities === true
                });
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg shadow-xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-semibold text-gray-800">
                                {property ? "Edit Property" : "Add New Property"}
                            </h2>
                            <button
                                onClick={onCancel}
                                className="text-gray-400 hover:text-gray-600"
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Property Name</label>
                                <input
                                    type="text"
                                    required
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>

        // Dashboard Component (only rendered when authenticated)
        // App: Main component with authentication and dashboard
        function App() {
            const [authenticated, setAuthenticated] = useState(() => isAuthenticated());
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [editingProperty, setEditingProperty] = useState(null);
            const [filters, setFilters] = useState({ ...EMPTY_FILTERS });
            const [activePage, setActivePage] = useState("home");
            const [customers, setCustomers] = useState([]);
            const [customersLoading, setCustomersLoading] = useState(false);
            const [customersError, setCustomersError] = useState("");
            const [customerPage, setCustomerPage] = useState(0);
            const [customerPageInfo, setCustomerPageInfo] = useState({ totalPages: 0, totalElements: 0 });
            const [customerSaving, setCustomerSaving] = useState(false);
            const [customerFormError, setCustomerFormError] = useState("");
            const [editingCustomer, setEditingCustomer] = useState(null);
            const [leads, setLeads] = useState([]);
            const [leadsLoading, setLeadsLoading] = useState(false);
            const [leadsError, setLeadsError] = useState("");
            const [leadFilters, setLeadFilters] = useState({ ...LEAD_EMPTY_FILTERS });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [editingLead, setEditingLead] = useState(null);
            const [leadSaving, setLeadSaving] = useState(false);
            const [leadFormError, setLeadFormError] = useState("");
            const [siteVisits, setSiteVisits] = useState([]);
            const [siteVisitsLoading, setSiteVisitsLoading] = useState(false);
            const [siteVisitsError, setSiteVisitsError] = useState("");
            const [siteVisitFilters, setSiteVisitFilters] = useState({ ...SITE_VISIT_EMPTY_FILTERS });
            const [showSiteVisitForm, setShowSiteVisitForm] = useState(false);
            const [editingSiteVisit, setEditingSiteVisit] = useState(null);
            const [siteVisitSaving, setSiteVisitSaving] = useState(false);
            const [siteVisitFormError, setSiteVisitFormError] = useState("");
            const [followUps, setFollowUps] = useState([]);
            const [followUpsLoading, setFollowUpsLoading] = useState(false);
            const [followUpsError, setFollowUpsError] = useState("");
            const [followUpFilters, setFollowUpFilters] = useState({ ...FOLLOW_UP_EMPTY_FILTERS });
            const [showFollowUpForm, setShowFollowUpForm] = useState(false);
            const [editingFollowUp, setEditingFollowUp] = useState(null);
            const [followUpSaving, setFollowUpSaving] = useState(false);
            const [followUpFormError, setFollowUpFormError] = useState("");

            const handleLogin = () => setAuthenticated(true);

            const handleLogout = () => {
                removeAuthToken();
                setAuthenticated(false);
            };

            // Fetch properties from API (only when authenticated)
            useEffect(() => {
                if (authenticated) {
                    fetchProperties();
                }
            }, [authenticated]);

            useEffect(() => {
                if (authenticated && activePage === "customers") {
                    fetchCustomers(customerPage);
                }
            }, [authenticated, activePage, customerPage]);

            useEffect(() => {
                if (authenticated && activePage === "leads") {
                    fetchLeads();
                }
            }, [authenticated, activePage]);

            useEffect(() => {
                if (authenticated && activePage === "siteVisits") {
                    fetchSiteVisits();
                }
            }, [authenticated, activePage]);

            useEffect(() => {
                if (authenticated && activePage === "followUps") {
                    fetchFollowUps();
                }
            }, [authenticated, activePage]);

            const fetchCustomers = async (page) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);
                setCustomersLoading(true);
                setCustomersError("");
                try {
                    const query = new URLSearchParams({ page: String(page), size: "10", sortBy: "name", sortDir: "asc" });
                    const response = await fetch(`${API_BASE_URL}/api/customers?${query}`, {
                        headers: { "Content-Type": "application/json" },
                        signal: controller.signal
                    });
                    if (!response.ok) {
                        throw new Error(`The server returned error ${response.status}.`);
                    }
                    const data = await response.json();
                    const rows = Array.isArray(data) ? data : data.content;
                    if (!Array.isArray(rows)) {
                        throw new Error("The server returned customer data in an unexpected format.");
                    }
                    setCustomers(rows);
                    setCustomerPageInfo({
                        totalPages: Number.isFinite(data.totalPages) ? data.totalPages : (rows.length ? 1 : 0),
                        totalElements: Number.isFinite(data.totalElements) ? data.totalElements : rows.length
                    });
                } catch (error) {
                    setCustomers([]);
                    setCustomersError(error.name === "AbortError"
                        ? "The request took too long. Check the backend status and try again."
                        : (error.message || "Check the connection to the backend and try again."));
                } finally {
                    clearTimeout(timeoutId);
                    setCustomersLoading(false);
                }
            };

            const fetchLeads = async () => {
                setLeadsLoading(true);
                setLeadsError("");
                try {
                    const response = await fetch(`${API_BASE_URL}/api/leads`, {
                        headers: { "Content-Type": "application/json" }
                    });
                    if (!response.ok) {
                        throw new Error(`The server returned error ${response.status}.`);
                    }
                    const data = await response.json();
                    const rows = Array.isArray(data) ? data : data.content;
                    if (!Array.isArray(rows)) {
                        throw new Error("The server returned lead data in an unexpected format.");
                    }
                    setLeads(rows);

                    // Also fetch customers and properties for the form dropdowns
                    if (customers.length === 0) {
                        fetchCustomers(0);
                    }
                    if (properties.length === 0) {
                        fetchProperties();
                    }
                } catch (error) {
                    setLeads([]);
                    setLeadsError(error.message || "Check the connection to the backend and try again.");
                } finally {
                    setLeadsLoading(false);
                }
            };

            const fetchSiteVisits = async () => {
                setSiteVisitsLoading(true);
                setSiteVisitsError("");
                try {
                    const response = await fetch(`${API_BASE_URL}/api/site-visits`, {
                        headers: { "Content-Type": "application/json" }
                    });

                        throw new Error(`The server returned error ${response.status}.`);
                    }
                    const data = await response.json();
                    const rows = Array.isArray(data) ? data : data.content;

                    }
                    setSiteVisits(rows);

                    // Also fetch leads and properties for the form dropdowns
                    if (leads.length === 0) {
                        fetchLeads();
                    }
                    if (properties.length === 0) {
                        fetchProperties();
                    }
                } catch (error) {
                    setSiteVisits([]);
                    setSiteVisitsError(error.message || "Check the connection to the backend and try again.");
                } finally {
                    setSiteVisitsLoading(false);
                }
            };

            const fetchFollowUps = async () => {

                setFollowUpsError("");
                try {
                    const response = await fetch(`${API_BASE_URL}/api/follow-ups`, {
                        headers: { "Content-Type": "application/json" }
                    });
                    if (!response.ok) {
                        throw new Error(`The server returned error ${response.status}.`);
                    }
                    const data = await response.json();
                    const rows = Array.isArray(data) ? data : data.content;
                    if (!Array.isArray(rows)) {
                        throw new Error("The server returned follow-up data in an unexpected format.");
                    }
                    setFollowUps(rows);

                    // Also fetch leads for the form dropdowns
                    if (leads.length === 0) {
                        fetchLeads();
                    }
                } catch (error) {
                    setFollowUps([]);
                    setFollowUpsError(error.message || "Check the connection to the backend and try again.");
                } finally {
                    setFollowUpsLoading(false);
                }
            };

            const fetchProperties = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/properties`, {
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    if (!response.ok) {
                        console.error('Failed to fetch properties:', response.status);
                        setProperties([]);
                        return;
                    }

                    const data = await response.json();
                    console.log('Fetched properties:', data);

                    // Ensure data is an array
                    if (Array.isArray(data)) {
                        setProperties(data);
                    } else {
                        console.error('Expected array but got:', typeof data, data);
                        setProperties([]);
                    }
                } catch (error) {
                    console.error('Error fetching properties:', error);
                    setProperties([]);
                } finally {
                    setLoading(false);
                }
            };

            const handleAddProperty = () => {
                setEditingProperty(null);
                setActivePage("properties");
                setShowForm(true);
            };

            const handleEditProperty = (property) => {
                setEditingProperty(property);
                setShowForm(true);
            };

            const handleSaveProperty = async (propertyData) => {
                try {
                    const url = propertyData.ID ? `${API_BASE_URL}/api/properties/${propertyData.ID}` : `${API_BASE_URL}/api/properties`;
                    const method = propertyData.ID ? 'PUT' : 'POST';

                    const { ID, ...dataToSend } = propertyData;

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',

                        body: JSON.stringify(dataToSend),

                    if (response.ok) {
                        await fetchProperties();
                        setShowForm(false);
                        setEditingProperty(null);

                        console.error('Error saving property');

                    console.error('Error saving property:', error);

                    const response = await fetch(`${API_BASE_URL}/api/customers${editingCustomer ? `/${editingCustomer.id}` : ""}`, {
                        method: editingCustomer ? "PUT" : "POST",
                        headers: { "Content-Type": "application/json" },

            const handleEditSiteVisit = (siteVisit) => {
                setEditingSiteVisit(siteVisit);
                setSiteVisitFormError("");
                setShowSiteVisitForm(true);
            };

            const handleSaveSiteVisit = async (siteVisitData) => {
                setSiteVisitSaving(true);
                setSiteVisitFormError("");
                try {
                    const url = editingSiteVisit ? `${API_BASE_URL}/api/site-visits/${editingSiteVisit.id}` : `${API_BASE_URL}/api/site-visits`;
                    const method = editingSiteVisit ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ...siteVisitData,
                            visitDate: siteVisitData.visitDate ? new Date(siteVisitData.visitDate).toISOString() : null
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`The server could not save this site visit (error ${response.status}).`);
                    }

                    await fetchSiteVisits();
                    setShowSiteVisitForm(false);
                    setEditingSiteVisit(null);
                } catch (error) {
                    setSiteVisitFormError(error.message || "The site visit could not be saved. Check the connection and try again.");
                } finally {
                    setSiteVisitSaving(false);
                }
            };

            const handleDeleteSiteVisit = async (id) => {
                if (window.confirm('Are you sure you want to delete this site visit?')) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/site-visits/${id}`, {
                            method: 'DELETE',
                        });

                        if (response.ok) {
                            await fetchSiteVisits();
                        } else {
                            console.error('Error deleting site visit');
                        }
                    } catch (error) {
                        console.error('Error deleting site visit:', error);
                    }
                }
            };

            const handleAddFollowUp = () => {
                setEditingFollowUp(null);
                setFollowUpFormError("");
                setShowFollowUpForm(true);
            };

            const handleEditFollowUp = (followUp) => {
                setEditingFollowUp(followUp);
                setFollowUpFormError("");
                setShowFollowUpForm(true);
            };

            const handleSaveFollowUp = async (followUpData) => {
                setFollowUpSaving(true);
                setFollowUpFormError("");
                try {
                    const url = editingFollowUp ? `${API_BASE_URL}/api/follow-ups/${editingFollowUp.id}` : `${API_BASE_URL}/api/follow-ups`;
                    const method = editingFollowUp ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ...followUpData,
                            followUpDate: followUpData.followUpDate ? new Date(followUpData.followUpDate).toISOString() : null
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`The server could not save this follow-up (error ${response.status}).`);
                    }

                    await fetchFollowUps();
                    setShowFollowUpForm(false);
                    setEditingFollowUp(null);
                } catch (error) {
                    setFollowUpFormError(error.message || "The follow-up could not be saved. Check the connection and try again.");
                } finally {
                    setFollowUpSaving(false);
                }
            };

            const handleDeleteFollowUp = async (id) => {
                if (window.confirm('Are you sure you want to delete this follow-up?')) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/follow-ups/${id}`, {
                            method: 'DELETE',
                        });

                        if (response.ok) {
                            await fetchFollowUps();
                        } else {
                            console.error('Error deleting follow-up');
                        }
                    } catch (error) {
                        console.error('Error deleting follow-up:', error);
                    }
                }
            };

            // Filter properties based on selected filters
            const filteredProperties = useMemo(() => {
                console.log('Filtering properties with filters:', filters);
                const result = properties.filter(property => {
                    // Property Type filter
                    if (filters.propertyType && property.propertyType !== filters.propertyType) {
                        return false;
                    }

                    // Flat Type filter (only applicable for flats)
                    if (filters.flatType && property.propertyType === "Flat" && property.flatType !== filters.flatType) {
                        return false;
                    }

                    // Sale Type filter
                    if (filters.saleType && property.saleType !== filters.saleType) {
                        return false;
                    }

                    // Budget range filter
                    if (filters.minBudget && property.price < parseInt(filters.minBudget)) {
                        return false;
                    }
                    if (filters.maxBudget && property.price > parseInt(filters.maxBudget)) {
                        return false;
                    }

                    // Locality filter
                    if (filters.locality && property.locality !== filters.locality) {
                        return false;
                    }

                    // City filter
                    if (filters.city && property.city !== filters.city) {
                        return false;
                    }

                    // Possession Month filter
                    if (filters.possessionMonth && property.possessionMonth !== filters.possessionMonth) {
                        return false;
                    }

                    // Possession Year filter
                    if (filters.possessionYear && property.possessionYear !== filters.possessionYear) {
                        return false;
                    }

                    // Amenities filter
                    if (filters.amenities !== "" && property.amenities !== (filters.amenities === "true")) {
                        return false;
                    }

                    // Carpet Area filter (minimum area)
                    if (filters.carpetArea && property.carpetArea && property.carpetArea < parseInt(filters.carpetArea)) {
                        return false;
                    }

                    // Floor Number filter (exact match)
                    if (filters.floorNumber && property.floorNumber !== null && property.floorNumber !== undefined && property.floorNumber !== parseInt(filters.floorNumber)) {
                        return false;
                    }

                    // Parking filter
                    if (filters.parking && property.parking !== filters.parking) {
                        return false;
                    }

                    return true;
                });
                console.log('Filtered result count:', result.length);
                return result;
            }, [filters, properties]);

            // Render login page if not authenticated
            if (!authenticated) {
                return <LoginPage onLogin={handleLogin} />;
            }

            // Render dashboard if authenticated
            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">Masterkey Solutions</h1>
                                    <p className="text-sm text-gray-500">{activePage === "home" ? "Real Estate CRM Dashboard" : activePage === "customers" || activePage === "addCustomer" ? "Customer management" : "Property search and management"}</p>
                                </div>
                                <div className="flex flex-wrap items-center justify-end gap-2 sm:gap-3">
                                    {activePage !== "home" && (
                                        <button onClick={() => setActivePage("home")} className="px-4 py-2 border border-gray-300 bg-white text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">Back to dashboard</button>
                                    )}
                                    <button
                                        onClick={handleLogout}
                                        className="px-4 py-2 border border-red-200 bg-white text-red-600 text-sm font-medium rounded-lg hover:bg-red-50 transition-colors"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activePage === "home" ? (
                            <div className="max-w-6xl mx-auto">
                                <div className="mb-7">
                                    <p className="text-sm font-semibold uppercase tracking-wider text-blue-600 mb-2">Workspace</p>
                                    <h2 className="text-3xl font-bold text-gray-900">Good to see you</h2>
                                    <p className="text-gray-600 mt-2">Choose an area to continue managing your real estate business.</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
                                    <button onClick={() => setActivePage("properties")} className="group aspect-square rounded-2xl bg-gradient-to-br from-blue-600 to-blue-800 p-6 text-left text-white shadow-lg shadow-blue-900/10 transition duration-200 hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-blue-300">
                                        <div className="flex h-full flex-col">
                                            <span className="mb-auto inline-flex h-14 w-14 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/20">
                                                <svg className="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9 20v-6h6v6" /></svg>
                                            </span>
                                            <span className="text-2xl font-bold">Properties</span>
                                            <span className="mt-2 text-sm text-blue-100">Browse, filter, and manage listings</span>
                                            <span className="mt-5 text-sm font-semibold">Open properties</span>
                                        </div>
                                    </button>

                                    <button onClick={() => setActivePage("customers")} className="group aspect-square rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-800 p-6 text-left text-white shadow-lg shadow-emerald-900/10 transition duration-200 hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-emerald-300">
                                        <div className="flex h-full flex-col">
                                            <span className="mb-auto inline-flex h-14 w-14 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/20">
                                                <svg className="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m6-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
                                            </span>
                                            <span className="text-2xl font-bold">Customers</span>
                                            <span className="mt-2 text-sm text-emerald-100">View and add customer contacts</span>
                                            <span className="mt-5 text-sm font-semibold">Open customers</span>
                                        </div>
                                    </button>

                                    <button onClick={() => setActivePage("leads")} className="group aspect-square rounded-2xl bg-gradient-to-br from-purple-600 to-purple-800 p-6 text-left text-white shadow-lg shadow-purple-900/10 transition duration-200 hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-purple-300">
                                        <div className="flex h-full flex-col">
                                            <span className="mb-auto inline-flex h-14 w-14 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/20">
                                                <svg className="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M17 20h5v-2a4 4 0 0 0-5.2-3.82M17 20H7m10 0v-2c0-.72-.15-1.4-.42-2M7 20H2v-2a4 4 0 0 1 5.2-3.82M7 20v-2c0-.72.15-1.4.42-2m0 0a5 5 0 0 1 9.16 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm5 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM8 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" /></svg>
                                            </span>
                                            <span className="text-2xl font-bold">Leads</span>
                                            <span className="mt-2 text-sm text-purple-100">Keep track of new opportunities</span>
                                            <span className="mt-5 text-sm font-semibold">Open leads</span>
                                        </div>
                                    </button>

                                    <button onClick={() => setActivePage("siteVisits")} className="group aspect-square rounded-2xl bg-gradient-to-br from-orange-600 to-orange-800 p-6 text-left text-white shadow-lg shadow-orange-900/10 transition duration-200 hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-orange-300">
                                        <div className="flex h-full flex-col">
                                            <span className="mb-auto inline-flex h-14 w-14 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/20">
                                                <svg className="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                            </span>
                                            <span className="text-2xl font-bold">Site Visits</span>
                                            <span className="mt-2 text-sm text-orange-100">Schedule and track property showings</span>
                                            <span className="mt-5 text-sm font-semibold">Open site visits</span>
                                        </div>
                                    </button>

                                    <button onClick={() => setActivePage("followUps")} className="group aspect-square rounded-2xl bg-gradient-to-br from-yellow-500 to-yellow-700 p-6 text-left text-white shadow-lg shadow-yellow-900/10 transition duration-200 hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-yellow-300">
                                        <div className="flex h-full flex-col">
                                            <span className="mb-auto inline-flex h-14 w-14 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/20">
                                                <svg className="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 8v4l2.5 2.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                                            </span>
                                            <span className="text-2xl font-bold">Follow-ups</span>
                                            <span className="mt-2 text-sm text-yellow-100">Stay on top of customer conversations</span>
                                            <span className="mt-5 text-sm font-semibold">Open follow-ups</span>
                                        </div>
                                    </button>
                                </div>

                                <section className="mt-8 rounded-2xl border border-blue-100 bg-blue-50/70 p-5 sm:p-6">
                                    <div className="flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
                                        <div>
                                            <p className="text-xs font-bold uppercase tracking-wider text-blue-700">Quick actions</p>
                                            <h3 className="mt-1 text-lg font-semibold text-gray-900">Add something new</h3>
                                            <p className="mt-1 text-sm text-gray-600">Create a listing or save a customer contact.</p>
                                        </div>
                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <button onClick={handleAddProperty} className="inline-flex items-center justify-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-semibold text-blue-700 shadow-sm ring-1 ring-blue-200 transition hover:bg-blue-600 hover:text-white hover:ring-blue-600">
                                                <span className="text-lg leading-none">+</span> Add property
                                            </button>
                                            <button onClick={() => { setCustomerFormError(""); setActivePage("addCustomer"); }} className="inline-flex items-center justify-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-semibold text-emerald-700 shadow-sm ring-1 ring-emerald-200 transition hover:bg-emerald-600 hover:text-white hover:ring-emerald-600">
                                                <span className="text-lg leading-none">+</span> Add customer
                                            </button>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        ) : activePage === "customers" ? (
                            <CustomersPage
                                customers={customers}
                                loading={customersLoading}
                                error={customersError}
                                page={customerPage}
                                totalPages={customerPageInfo.totalPages}
                                totalElements={customerPageInfo.totalElements}
                                onPageChange={setCustomerPage}
                                onRetry={() => fetchCustomers(customerPage)}
                                onAddCustomer={() => { setEditingCustomer(null); setCustomerFormError(""); setActivePage("addCustomer"); }}
                                onEditCustomer={(customer) => { setEditingCustomer(customer); setCustomerFormError(""); setActivePage("editCustomer"); }}
                            />
                        ) : activePage === "addCustomer" || activePage === "editCustomer" ? (
                            <CustomerForm
                                key={editingCustomer?.id || "new-customer"}
                                customer={activePage === "editCustomer" ? editingCustomer : null}
                                onSave={handleSaveCustomer}
                                onCancel={() => { setCustomerFormError(""); setEditingCustomer(null); setActivePage("customers"); }}
                                saving={customerSaving}
                                error={customerFormError}
                            />
                        ) : activePage === "leads" ? (
                            <LeadsPage
                                leads={leads}
                                customers={customers}
                                properties={properties}
                                loading={leadsLoading}
                                error={leadsError}
                                onAddLead={handleAddLead}
                                onEditLead={handleEditLead}
                                onDeleteLead={handleDeleteLead}
                                filters={leadFilters}
                                setFilters={setLeadFilters}
                            />
                        ) : activePage === "siteVisits" ? (
                            <SiteVisitsPage
                                siteVisits={siteVisits}
                                leads={leads}
                                properties={properties}
                                loading={siteVisitsLoading}
                                error={siteVisitsError}
                                onAddSiteVisit={handleAddSiteVisit}
                                onEditSiteVisit={handleEditSiteVisit}
                                onDeleteSiteVisit={handleDeleteSiteVisit}
                                filters={siteVisitFilters}
                                setFilters={setSiteVisitFilters}
                            />
                        ) : activePage === "followUps" ? (
                            <FollowUpsPage
                                followUps={followUps}
                                leads={leads}
                                loading={followUpsLoading}
                                error={followUpsError}
                                onAddFollowUp={handleAddFollowUp}
                                onEditFollowUp={handleEditFollowUp}
                                onDeleteFollowUp={handleDeleteFollowUp}
                                filters={followUpFilters}
                                setFilters={setFollowUpFilters}
                            />
                        ) : <>
                        <div className="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                            <div>
                                <p className="text-sm font-semibold uppercase tracking-wider text-blue-600">Properties</p>
                                <h2 className="mt-1 text-2xl font-bold text-gray-900">Property listings</h2>
                            </div>
                            <button onClick={handleAddProperty} className="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-md shadow-blue-900/10 transition hover:bg-blue-700">
                                <span className="text-lg leading-none">+</span> Add property
                            </button>
                        </div>
                        <FilterPanel filters={filters} setFilters={setFilters} />

                        {/* Results Section */}
                        <div className="mb-4">
                            <h2 className="text-lg font-semibold text-gray-800">
                                {loading ? (
                                    <span>Loading properties...</span>
                                ) : filteredProperties.length === 0 ? (
                                    <span>No properties found</span>
                                ) : (
                                    <span>Found {filteredProperties.length} properties</span>
                                )}
                            </h2>
                        </div>

                        {loading ? (
                            <div className="bg-white rounded-lg shadow-md p-12 text-center">
                                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">Loading properties...</h3>
                            </div>
                        ) : filteredProperties.length === 0 ? (
                            <div className="bg-white rounded-lg shadow-md p-12 text-center">
                                <svg className="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">No properties found</h3>
                                <p className="text-gray-500">Try adjusting your filters or add a new property</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredProperties.map(property => (
                                    <PropertyCard
                                        key={property.id}
                                        property={property}
                                        onEdit={handleEditProperty}
                                        onDelete={handleDeleteProperty}
                                    />
                                ))}
                            </div>
                        )}
                        </>}
                    </main>

                    {/* Property Form Modal */}
                    {showForm && (
                        <PropertyForm
                            property={editingProperty}
                            onSave={handleSaveProperty}
                            onCancel={() => {
                                setShowForm(false);
                                setEditingProperty(null);
                            }}
                        />
                    )}

                    {/* Lead Form Modal */}
                    {showLeadForm && (
                        <LeadForm
                            lead={editingLead}
                            customers={customers}
                            properties={properties}
                            onSave={handleSaveLead}
                            onCancel={() => {
                                setShowLeadForm(false);
                                setEditingLead(null);
                                setLeadFormError("");
                            }}
                            saving={leadSaving}
                            error={leadFormError}
                        />
                    )}

                    {/* Site Visit Form Modal */}
                    {showSiteVisitForm && (
                        <SiteVisitForm
                            siteVisit={editingSiteVisit}
                            leads={leads}
                            properties={properties}
                            onSave={handleSaveSiteVisit}
                            onCancel={() => {
                                setShowSiteVisitForm(false);
                                setEditingSiteVisit(null);
                                setSiteVisitFormError("");
                            }}
                            saving={siteVisitSaving}
                            error={siteVisitFormError}
                        />
                    )}

                    {/* Follow Up Form Modal */}
                    {showFollowUpForm && (
                        <FollowUpForm
                            followUp={editingFollowUp}
                            leads={leads}
                            onSave={handleSaveFollowUp}
                            onCancel={() => {
                                setShowFollowUpForm(false);
                                setEditingFollowUp(null);
                                setFollowUpFormError("");
                            }}
                            saving={followUpSaving}
                            error={followUpFormError}
                        />
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-gray-200 mt-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <p className="text-center text-sm text-gray-500">
                                © 2024 Real Estate CRM. Admin Dashboard for Pimpri-Chinchwad Properties.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
