<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate CRM - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // API Base URL - Change this to your deployed backend URL
        // For local development: 'http://localhost:8080'
        // For Render deployment: 'https://real-estate-crm-backend-3any.onrender.com'
        const API_BASE_URL = localStorage.getItem('API_BASE_URL') || 'https://real-estate-crm-backend-3any.onrender.com';

        // Shared option lists (used by both the filter panel and the property form)
        const LOCALITIES = ["Wakad", "Hinjawadi", "Ravet", "Tathawade", "Moshi", "Chinchwad", "Punawale", "Kiwale", "Mamurdi", "Baner", "Balewadi",
            "Kharadi", "Aundh", "Bavdhan", "Vikas Nagar", "Adarsh Nagar", "Pimpri"];
        const CITIES = ["Pimpri-Chinchwad", "Pune"];
        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const SALE_TYPES = ["Ready to Move", "Under Construction", "Resale", "Rent"];
        const FURNISHING_OPTIONS = [
            { value: "No", label: "Unfurnished" },
            { value: "Semi", label: "Semi-Furnished" },
            { value: "Full", label: "Fully Furnished" }
        ];

        const EMPTY_FILTERS = {
            propertyType: "",
            flatType: "",
            minBudget: "",
            maxBudget: "",
            locality: "",
            city: "",
            possessionMonth: "",
            possessionYear: "",
            amenities: "",
            saleType: "",
            furnishing: "",
            carpetArea: "",
            floorNumber: ""
        };

        // Authentication utilities
        const getAuthToken = () => localStorage.getItem('authToken');
        const setAuthToken = (token) => localStorage.setItem('authToken', token);
        const removeAuthToken = () => localStorage.removeItem('authToken');
        const isAuthenticated = () => !!getAuthToken();

        // Login Component
        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                // Simple client-side authentication check
                if (username === 'admin' && password === 'admin123') {
                    setAuthToken('dummy-token');
                    onLogin();
                } else {
                    setError('Invalid credentials. Please try again.');
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Real Estate CRM</h1>
                            <p className="text-gray-600">Admin Dashboard Login</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Username</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Enter username"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Enter password"
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md text-sm">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 text-white py-3 rounded-md font-medium hover:bg-blue-700 transition-colors disabled:bg-blue-400 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Signing in...' : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Format price in Indian Rupees
        const formatPrice = (price) => {
            if (price >= 10000000) {
                return `₹${(price / 10000000).toFixed(2)} Cr`;
            } else if (price >= 100000) {
                return `₹${(price / 100000).toFixed(2)} L`;
            }
            return `₹${price.toLocaleString('en-IN')}`;
        };

        const getFurnishingLabel = (value) => {
            const match = FURNISHING_OPTIONS.find(o => o.value === value);
            return match ? match.label : null;
        };

        // Filter Component
        function FilterPanel({ filters, setFilters }) {
            const currentYear = new Date().getFullYear();
            const years = Array.from({ length: 5 }, (_, i) => currentYear + i);

            const handleReset = () => {
                setFilters({ ...EMPTY_FILTERS });
            };

            const nonFlatSelected = filters.propertyType && filters.propertyType !== "Flat";

            return (
                <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-semibold text-gray-800">Property Filters</h2>
                        <button 
                            onClick={handleReset}
                            className="text-sm text-blue-600 hover:text-blue-800 font-medium"
                        >
                            Reset Filters
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {/* Property Type */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Property Type</label>
                            <select
                                value={filters.propertyType}
                                onChange={(e) => setFilters({...filters, propertyType: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Types</option>
                                <option value="Flat">Flat</option>
                                <option value="Plot">Plot</option>
                                <option value="Land">Land</option>
                            </select>
                        </div>

                        {/* Flat Type */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Flat Type</label>
                            <select
                                value={filters.flatType}
                                onChange={(e) => setFilters({...filters, flatType: e.target.value})}
                                disabled={nonFlatSelected}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
                            >
                                <option value="">All Configurations</option>
                                <option value="1 BHK">1 BHK</option>
                                <option value="2 BHK">2 BHK</option>
                                <option value="3 BHK">3 BHK</option>
                                <option value="4 BHK">4 BHK</option>
                            </select>
                        </div>

                        {/* Sale Type */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Sale Type</label>
                            <select
                                value={filters.saleType}
                                onChange={(e) => setFilters({...filters, saleType: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All</option>
                                {SALE_TYPES.map(type => (
                                    <option key={type} value={type}>{type}</option>
                                ))}
                            </select>
                        </div>

                        {/* Furnishing */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Furnishing</label>
                            <select
                                value={filters.furnishing}
                                onChange={(e) => setFilters({...filters, furnishing: e.target.value})}
                                disabled={nonFlatSelected}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
                            >
                                <option value="">Any</option>
                                {FURNISHING_OPTIONS.map(opt => (
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                ))}
                            </select>
                        </div>

                        {/* Budget Range - Min */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Min Budget (₹)</label>
                            <input
                                type="number"
                                value={filters.minBudget}
                                onChange={(e) => setFilters({...filters, minBudget: e.target.value})}
                                placeholder="Min"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Budget Range - Max */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Max Budget (₹)</label>
                            <input
                                type="number"
                                value={filters.maxBudget}
                                onChange={(e) => setFilters({...filters, maxBudget: e.target.value})}
                                placeholder="Max"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Carpet Area */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Carpet Area (sqft)</label>
                            <input
                                type="number"
                                value={filters.carpetArea}
                                onChange={(e) => setFilters({...filters, carpetArea: e.target.value})}
                                placeholder="Min Area"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Floor Number */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Floor Number</label>
                            <input
                                type="number"
                                value={filters.floorNumber}
                                onChange={(e) => setFilters({...filters, floorNumber: e.target.value})}
                                placeholder="Floor"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        {/* Locality */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Locality</label>
                            <select
                                value={filters.locality}
                                onChange={(e) => setFilters({...filters, locality: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Localities</option>
                                {LOCALITIES.map(locality => (
                                    <option key={locality} value={locality}>{locality}</option>
                                ))}
                            </select>
                        </div>

                        {/* City */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">City</label>
                            <select
                                value={filters.city}
                                onChange={(e) => setFilters({...filters, city: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Cities</option>
                                {CITIES.map(city => (
                                    <option key={city} value={city}>{city}</option>
                                ))}
                            </select>
                        </div>

                        {/* Possession Month */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Possession Month</label>
                            <select
                                value={filters.possessionMonth}
                                onChange={(e) => setFilters({...filters, possessionMonth: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">Any Month</option>
                                {MONTHS.map(month => (
                                    <option key={month} value={month}>{month}</option>
                                ))}
                            </select>
                        </div>

                        {/* Possession Year */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Possession Year</label>
                            <select
                                value={filters.possessionYear}
                                onChange={(e) => setFilters({...filters, possessionYear: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">Any Year</option>
                                {years.map(year => (
                                    <option key={year} value={year}>{year}</option>
                                ))}
                            </select>
                        </div>

                        {/* Amenities */}
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Amenities Available</label>
                            <select
                                value={filters.amenities}
                                onChange={(e) => setFilters({...filters, amenities: e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">Any</option>
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                    </div>
                </div>
            );
        }

        // Property Card Component
        function PropertyCard({ property, onEdit, onDelete }) {
            const getPropertyTypeDisplay = () => {
                if (property.propertyType === "Flat" && property.flatType) {
                    return `${property.flatType} Flat`;
                }
                return property.propertyType === "Plot" ? "Residential Plot" : `${property.propertyType}`;
            };

            const furnishingLabel = getFurnishingLabel(property.furnishing);

            return (
                <div className="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">
                    <div className="p-5">
                        <div className="flex justify-between items-start mb-3">
                            <h3 className="text-lg font-bold text-gray-900 flex-1">{property.name}</h3>
                            <span className={`px-2 py-1 text-xs font-medium rounded-full ${property.amenities ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}`}>
                                {property.amenities ? 'Amenities: Yes' : 'Amenities: No'}
                            </span>
                        </div>

                        {(property.saleType || furnishingLabel) && (
                            <div className="flex flex-wrap gap-2 mb-3">
                                {property.saleType && (
                                    <span className="px-2 py-1 text-xs font-medium rounded-full bg-sky-100 text-sky-800">
                                        {property.saleType}
                                    </span>
                                )}
                                {furnishingLabel && (
                                    <span className="px-2 py-1 text-xs font-medium rounded-full bg-purple-100 text-purple-800">
                                        {furnishingLabel}
                                    </span>
                                )}
                            </div>
                        )}
                        
                        <div className="space-y-2 text-sm text-gray-600">
                            <div className="flex items-center">
                                <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span>{property.locality}, {property.city}</span>
                            </div>
                            
                            <div className="flex items-center">
                                <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span>Possession: {property.possessionMonth} {property.possessionYear}</span>
                            </div>
                            
                            <div className="flex items-center">
                                <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                                </svg>
                                <span>{getPropertyTypeDisplay()}</span>
                            </div>

                            {property.carpetArea && (
                                <div className="flex items-center">
                                    <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                                    </svg>
                                    <span>Carpet Area: {property.carpetArea} sqft</span>
                                </div>
                            )}

                            {property.floorNumber && (
                                <div className="flex items-center">
                                    <svg className="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                    </svg>
                                    <span>Floor: {property.floorNumber}</span>
                                </div>
                            )}
                        </div>
                        
                        <div className="mt-4 pt-4 border-t border-gray-100">
                            <div className="text-2xl font-bold text-blue-600 mb-3">
                                {formatPrice(property.price)}
                            </div>
                            <div className="flex space-x-2">
                                <button
                                    onClick={() => onEdit(property)}
                                    className="flex-1 px-3 py-2 bg-blue-600 text-white text-sm font-medium rounded hover:bg-blue-700 transition-colors"
                                >
                                    Edit
                                </button>
                                <button
                                    onClick={() => onDelete(property.id)}
                                    className="flex-1 px-3 py-2 bg-red-600 text-white text-sm font-medium rounded hover:bg-red-700 transition-colors"
                                >
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Property Form Component
        function PropertyForm({ property, onSave, onCancel }) {
            const currentYear = new Date().getFullYear();
            const years = Array.from({ length: 5 }, (_, i) => currentYear + i);

            const [formData, setFormData] = useState(property ? {
                ...property,
                saleType: property.saleType || "",
                furnishing: property.furnishing || "",
                carpetArea: property.carpetArea || "",
                floorNumber: property.floorNumber || ""
            } : {
                name: "",
                locality: "",
                city: "",
                possessionMonth: "",
                possessionYear: "",
                price: "",
                propertyType: "",
                flatType: "",
                amenities: false,
                saleType: "",
                furnishing: "",
                carpetArea: "",
                floorNumber: ""
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    ID: property?.id,
                    ...formData,
                    price: Number(formData.price),
                    amenities: formData.amenities === "true" || formData.amenities === true
                });
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg shadow-xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-semibold text-gray-800">
                                {property ? "Edit Property" : "Add New Property"}
                            </h2>
                            <button
                                onClick={onCancel}
                                className="text-gray-400 hover:text-gray-600"
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Property Name</label>
                                <input
                                    type="text"
                                    required
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Locality</label>
                                    <select
                                        required
                                        value={formData.locality}
                                        onChange={(e) => setFormData({...formData, locality: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="">Select Locality</option>
                                        {LOCALITIES.map(locality => (
                                            <option key={locality} value={locality}>{locality}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">City</label>
                                    <select
                                        required
                                        value={formData.city}
                                        onChange={(e) => setFormData({...formData, city: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="">Select City</option>
                                        {CITIES.map(city => (
                                            <option key={city} value={city}>{city}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Possession Month</label>
                                    <select
                                        required
                                        value={formData.possessionMonth}
                                        onChange={(e) => setFormData({...formData, possessionMonth: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="">Select Month</option>
                                        {MONTHS.map(month => (
                                            <option key={month} value={month}>{month}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Possession Year</label>
                                    <select
                                        required
                                        value={formData.possessionYear}
                                        onChange={(e) => setFormData({...formData, possessionYear: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="">Select Year</option>
                                        {years.map(year => (
                                            <option key={year} value={year}>{year}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
                                <input
                                    type="number"
                                    required
                                    value={formData.price}
                                    onChange={(e) => setFormData({...formData, price: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Property Type</label>
                                    <select
                                        required
                                        value={formData.propertyType}
                                        onChange={(e) => setFormData({...formData, propertyType: e.target.value, flatType: "", furnishing: ""})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="">Select Type</option>
                                        <option value="Flat">Flat</option>
                                        <option value="Plot">Plot</option>
                                        <option value="Land">Land</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Flat Type</label>
                                    <select
                                        value={formData.flatType}
                                        onChange={(e) => setFormData({...formData, flatType: e.target.value})}
                                        disabled={formData.propertyType !== "Flat"}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
                                    >
                                        <option value="">Select Configuration</option>
                                        <option value="1 BHK">1 BHK</option>
                                        <option value="2 BHK">2 BHK</option>
                                        <option value="3 BHK">3 BHK</option>
                                        <option value="4 BHK">4 BHK</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Sale Type</label>
                                <select
                                    required
                                    value={formData.saleType}
                                    onChange={(e) => setFormData({...formData, saleType: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value="">Select Sale Type</option>
                                    {SALE_TYPES.map(type => (
                                        <option key={type} value={type}>{type}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Furnishing</label>
                                    <select
                                        value={formData.furnishing}
                                        onChange={(e) => setFormData({...formData, furnishing: e.target.value})}
                                        disabled={formData.propertyType !== "Flat"}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
                                    >
                                        <option value="">Select Furnishing</option>
                                        {FURNISHING_OPTIONS.map(opt => (
                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Carpet Area (sqft)</label>
                                    <input
                                        type="number"
                                        value={formData.carpetArea}
                                        onChange={(e) => setFormData({...formData, carpetArea: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="e.g., 1000"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Floor Number</label>
                                <input
                                    type="number"
                                    value={formData.floorNumber}
                                    onChange={(e) => setFormData({...formData, floorNumber: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="e.g., 3"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Amenities Available</label>
                                <select
                                    required
                                    value={formData.amenities}
                                    onChange={(e) => setFormData({...formData, amenities: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value="false">No</option>
                                    <option value="true">Yes</option>
                                </select>
                            </div>

                            <div className="flex space-x-3 pt-4">
                                <button
                                    type="submit"
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 transition-colors"
                                >
                                    {property ? "Update Property" : "Add Property"}
                                </button>
                                <button
                                    type="button"
                                    onClick={onCancel}
                                    className="flex-1 px-4 py-2 bg-gray-300 text-gray-700 font-medium rounded hover:bg-gray-400 transition-colors"
                                >
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Dashboard Component (only rendered when authenticated)
        // App: Main component with authentication and dashboard
        function App() {
            const [authenticated, setAuthenticated] = useState(() => isAuthenticated());
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [editingProperty, setEditingProperty] = useState(null);
            const [filters, setFilters] = useState({ ...EMPTY_FILTERS });

            const handleLogin = () => setAuthenticated(true);

            const handleLogout = () => {
                removeAuthToken();
                setAuthenticated(false);
            };

            // Fetch properties from API (only when authenticated)
            useEffect(() => {
                if (authenticated) {
                    fetchProperties();
                }
            }, [authenticated]);

            const fetchProperties = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/properties`, {
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    if (!response.ok) {
                        console.error('Failed to fetch properties:', response.status);
                        setProperties([]);
                        return;
                    }

                    const data = await response.json();
                    console.log('Fetched properties:', data);

                    // Ensure data is an array
                    if (Array.isArray(data)) {
                        setProperties(data);
                    } else {
                        console.error('Expected array but got:', typeof data, data);
                        setProperties([]);
                    }
                } catch (error) {
                    console.error('Error fetching properties:', error);
                    setProperties([]);
                } finally {
                    setLoading(false);
                }
            };

            const handleAddProperty = () => {
                setEditingProperty(null);
                setShowForm(true);
            };

            const handleEditProperty = (property) => {
                setEditingProperty(property);
                setShowForm(true);
            };

            const handleSaveProperty = async (propertyData) => {
                try {
                    const url = propertyData.ID ? `${API_BASE_URL}/api/properties/${propertyData.ID}` : `${API_BASE_URL}/api/properties`;
                    const method = propertyData.ID ? 'PUT' : 'POST';

                    const { ID, ...dataToSend } = propertyData;

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(dataToSend),
                    });

                    if (response.ok) {
                        await fetchProperties();
                        setShowForm(false);
                        setEditingProperty(null);
                    } else {
                        console.error('Error saving property');
                    }
                } catch (error) {
                    console.error('Error saving property:', error);
                }
            };

            const handleDeleteProperty = async (id) => {
                if (window.confirm('Are you sure you want to delete this property?')) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/properties/${id}`, {
                            method: 'DELETE',
                        });

                        if (response.ok) {
                            await fetchProperties();
                        } else {
                            console.error('Error deleting property');
                        }
                    } catch (error) {
                        console.error('Error deleting property:', error);
                    }
                }
            };

            // Filter properties based on selected filters
            const filteredProperties = useMemo(() => {
                return properties.filter(property => {
                    // Property Type filter
                    if (filters.propertyType && property.propertyType !== filters.propertyType) {
                        return false;
                    }

                    // Flat Type filter (only applicable for flats)
                    if (filters.flatType && property.propertyType === "Flat" && property.flatType !== filters.flatType) {
                        return false;
                    }

                    // Sale Type filter
                    if (filters.saleType && property.saleType !== filters.saleType) {
                        return false;
                    }

                    // Budget range filter
                    if (filters.minBudget && property.price < parseInt(filters.minBudget)) {
                        return false;
                    }
                    if (filters.maxBudget && property.price > parseInt(filters.maxBudget)) {
                        return false;
                    }

                    // Locality filter
                    if (filters.locality && property.locality !== filters.locality) {
                        return false;
                    }

                    // City filter
                    if (filters.city && property.city !== filters.city) {
                        return false;
                    }

                    // Possession Month filter
                    if (filters.possessionMonth && property.possessionMonth !== filters.possessionMonth) {
                        return false;
                    }

                    // Possession Year filter
                    if (filters.possessionYear && property.possessionYear !== filters.possessionYear) {
                        return false;
                    }

                    // Amenities filter
                    if (filters.amenities !== "" && property.amenities !== (filters.amenities === "true")) {
                        return false;
                    }

                    // Carpet Area filter
                    if (filters.carpetArea && property.carpetArea && property.carpetArea < parseInt(filters.carpetArea)) {
                        return false;
                    }

                    // Floor Number filter
                    if (filters.floorNumber && property.floorNumber && property.floorNumber !== parseInt(filters.floorNumber)) {
                        return false;
                    }

                    return true;
                });
            }, [filters, properties]);

            // Render login page if not authenticated
            if (!authenticated) {
                return <LoginPage onLogin={handleLogin} />;
            }

            // Render dashboard if authenticated
            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">Masterkey Solutions</h1>
                                    <p className="text-sm text-gray-500">Admin Property Search Dashboard</p>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <button
                                        onClick={handleAddProperty}
                                        className="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded hover:bg-blue-700 transition-colors"
                                    >
                                        + Add Property
                                    </button>
                                    <button
                                        onClick={handleLogout}
                                        className="px-4 py-2 bg-red-600 text-white text-sm font-medium rounded hover:bg-red-700 transition-colors"
                                    >
                                        Logout
                                    </button>
                                    <span className="text-sm text-gray-600">
                                        <span className="font-medium text-gray-900">{filteredProperties.length}</span> properties found
                                    </span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <FilterPanel filters={filters} setFilters={setFilters} />

                        {/* Results Section */}
                        <div className="mb-4">
                            <h2 className="text-lg font-semibold text-gray-800">
                                {loading ? (
                                    <span>Loading properties...</span>
                                ) : filteredProperties.length === 0 ? (
                                    <span>No properties found</span>
                                ) : (
                                    <span>Found {filteredProperties.length} properties</span>
                                )}
                            </h2>
                        </div>

                        {loading ? (
                            <div className="bg-white rounded-lg shadow-md p-12 text-center">
                                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">Loading properties...</h3>
                            </div>
                        ) : filteredProperties.length === 0 ? (
                            <div className="bg-white rounded-lg shadow-md p-12 text-center">
                                <svg className="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">No properties found</h3>
                                <p className="text-gray-500">Try adjusting your filters or add a new property</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredProperties.map(property => (
                                    <PropertyCard
                                        key={property.id}
                                        property={property}
                                        onEdit={handleEditProperty}
                                        onDelete={handleDeleteProperty}
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Property Form Modal */}
                    {showForm && (
                        <PropertyForm
                            property={editingProperty}
                            onSave={handleSaveProperty}
                            onCancel={() => {
                                setShowForm(false);
                                setEditingProperty(null);
                            }}
                        />
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-gray-200 mt-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <p className="text-center text-sm text-gray-500">
                                © 2024 Real Estate CRM. Admin Dashboard for Pimpri-Chinchwad Properties.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
